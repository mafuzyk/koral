[package]
name = "koral-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
koral = { path = ".." }

[[bin]]
name = "marks_scanner"
path = "fuzz_targets/marks_scanner.rs"
test = false
doc = false

[[bin]]
name = "graphics_handle"
path = "fuzz_targets/graphics_handle.rs"
test = false
doc = false

[[bin]]
name = "ipc_decode"
path = "fuzz_targets/ipc_decode.rs"
test = false
doc = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
