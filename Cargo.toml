[package]
name = "koral"
version = "1.0.2"
edition = "2024"
description = "A Rust terminal with native sharky shell support"
license = "GPL-3.0-only"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
flate2 = "1.1.10"
glyphon = "0.12"
png = "0.18.1"
polling = "3.11.0"
pollster = "1.0.1"
sharky-config = { git = "https://github.com/mafuzyk/sharky-shell", tag = "v3.0.0" }
ttf-parser = "0.25"
wgpu = "30"
winit = "0.30"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
