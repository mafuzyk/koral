[package]
name = "koral"
version = "0.1.0"
edition = "2024"
description = "A terminal built around the sharky shell"
license = "GPL-3.0-only"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
glyphon = "0.12"
polling = "3.11.0"
wgpu = "30"
winit = "0.30"
