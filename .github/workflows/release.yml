name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  binary:
    name: Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "::error::Tag must start with 'v' (got: $TAG)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Package
        run: |
          ./target/release/koral --version
          cp target/release/koral assets/koral.desktop assets/koral.svg assets/xterm-koral.terminfo .
          tar -czf koral-x86_64-linux.tar.gz koral koral.desktop koral.svg xterm-koral.terminfo LICENSE
          sha256sum koral-x86_64-linux.tar.gz > SHA256SUMS
      - name: Sign
        run: |
          cosign sign-blob --yes \
            --output-signature koral-x86_64-linux.tar.gz.sig \
            --output-certificate koral-x86_64-linux.tar.gz.pem \
            koral-x86_64-linux.tar.gz
          cosign verify-blob \
            --signature koral-x86_64-linux.tar.gz.sig \
            --certificate koral-x86_64-linux.tar.gz.pem \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*" \
            koral-x86_64-linux.tar.gz
      - name: Publish
        run: |
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) prerelease=(--prerelease) ;;
            *) prerelease=() ;;
          esac
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "koral ${TAG#v}" "${prerelease[@]}"
          gh release upload "$TAG" koral-x86_64-linux.tar.gz SHA256SUMS koral-x86_64-linux.tar.gz.sig koral-x86_64-linux.tar.gz.pem
